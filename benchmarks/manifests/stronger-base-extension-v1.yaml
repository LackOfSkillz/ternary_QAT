# ---- generation settings (frozen; identical semantics to Dispatch-24 for comparability) ----
generation:
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  do_sample: false
  decoding: greedy_argmax
  seed: 20260722
  max_new_tokens: 1024
  stop_conditions: []
