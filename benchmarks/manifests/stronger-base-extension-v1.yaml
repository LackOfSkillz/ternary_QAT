  packet_family:
    items: 18
    roles_run: [target_base_4b, ministral_3_8b_instruct, qwen3_8b_non_thinking]  # 4B rerun: no comparable prior result
    new_jobs: 54
  total_new_jobs: 94

# ---- packet-family arms + honest token-band status ----
packet_family:
  tasks: [scene_drafting, focused_revision, canon_sensitive_continuation]
  arms: [bare, compact, realistic, long, long_noisy, long_salience_repaired]
  noisy_repaired_identical_content: true   # differ only in ordering (verified in builder)
  token_bands:
    method: real per-model tokenizer counts recorded host-side in the run token-profile
    target_bands: {bare: "150-300", compact: "500-1000", realistic: "2000-4000",
                   long: "8000-12000", long_noisy: "8000-12000", long_salience_repaired: "~long_noisy"}
    honest_status:
      bare_compact_realistic: in_or_near_band
      long_family: >-
        LIMITATION — the authored project's full genuine compiled context is ~4.4-4.6K tokens
        (char-estimate; real per-model counts recorded at run time). Reaching the 8-12K target
        would require padding beyond the project's real material, which the dispatch prohibits.
        The long/noisy/repaired arms therefore stress salience and dilution at the project's
        TRUE full scale (~2x realistic), and the 8-12K long-context stress is explicitly NOT
        achieved without prohibited filler. Recorded as a limitation, not smoothed over.

# ---- execution topology ----
topology:
  wave_1: {gx10-9141: ministral_3_8b_instruct, gx10-5611: qwen3_8b_non_thinking}
  wave_2: {note: "4B control on the NEW packet family (no comparable prior result)"}
  host_assignment_excluded_from_reviewer_artifacts: true
  image: linewright-ternary-train:d26   # run001 + kernels==0.15.2

integrity_checks_required:
