# Dataset A — record schema (v1)
#
# Each source record is ONE Markdown file with YAML front matter + human sections.
# This file documents the front-matter fields and which are required per task
# family, and the required human-readable sections. It is the contract enforced
# by scripts/validate_dataset_a.py. Controlled values live in enums.yaml.

schema_version: 1

# ---- front-matter fields ----
# type notes: enum = value must appear in enums.yaml; list = YAML sequence.
fields:
  id:                    {type: string, desc: "unique, kebab id e.g. dsa-revision-001"}
  dataset:               {type: string, const: "dataset-a"}
  split:                 {type: enum, enum: split, desc: "unassigned for all seed records"}
  review_status:        {type: enum, enum: review_status}
  task_type:             {type: enum, enum: task_type}
  subtype:               {type: string, desc: "free but stable label within a task_type"}
  operating_mode:        {type: enum, enum: operating_mode}
  difficulty:            {type: enum, enum: difficulty}
  template_family:       {type: string, desc: "structural family; (family,cluster) must be unique"}
  semantic_cluster:      {type: string, desc: "content cluster; (family,cluster) must be unique"}
  style_profile:         {type: string, enum_optional: profiles, desc: "profile id or 'none'"}
  craft_targets:         {type: list}
  protected_craft:       {type: list}
  authorized_changes:    {type: list}
  unauthorized_changes:  {type: list}
  anti_slop_targets:     {type: list}
  anti_slop_risks:       {type: list}
  expected_properties:   {type: list, desc: "checkable properties of the gold output"}
  failure_modes:         {type: list, enum_items: failure_label}
  provenance:            {type: string, desc: "truthful origin statement; names the authoring model if any"}
  origin:                {type: enum, enum: origin, desc: "human_authored | model_authored | mixed_origin | unknown"}
  source_type:           {type: enum, enum: source_type}
  license_status:        {type: enum, enum: license_status}
  teacher_model:         {type: string, desc: "the model that authored/materially generated the record; 'none' ONLY if fully human_authored. Never write 'none' for model_authored content."}
  teacher_terms_status:  {type: enum, enum: teacher_terms_status}
  excluded_from_training: {type: bool}
  matched_pair_with:     {type: string, optional: true, enum_optional: record_id, desc: "id of a reciprocally-paired record, or absent"}
  causal_constraint_ids: {type: list, desc: "constraint_check only: the constraint IDs that JOINTLY make the passage a violation ([] for a non-violation). The gold constraint_ids must equal this set."}
  invention_budget:      {type: map, desc: "focused_revision only: {level: none|bounded|open, allowed: [...], prohibited: [...]}. Governs how much new material the revision may introduce."}
  public_domain_source:  {type: map, optional: true, desc: "REQUIRED when source_type == public_domain: {title, author, publication_year, edition_or_archive, source_url_or_identifier, verification_note}"}

# Provenance vs review discipline:
#   Provenance records ORIGIN (who/what authored the content). Review status
#   records ADJUDICATION (whether a human accepted it). Human review, editing, or
#   approval does NOT convert model-authored source material into human-authored
#   provenance. A model_authored record stays model_authored forever.

# fields required for EVERY record
required_all:
  - id
  - dataset
  - split
  - review_status
  - task_type
  - operating_mode
  - difficulty
  - template_family
  - semantic_cluster
  - provenance
  - origin
  - source_type
  - license_status
  - teacher_model
  - teacher_terms_status
  - excluded_from_training

# unknown front-matter keys are REJECTED unless declared in `fields` above.
allow_unknown_fields: false

# additional required fields by task family
required_by_task_type:
  canon_extraction:      [expected_properties]
  constraint_check:      [expected_properties, causal_constraint_ids]
  focused_revision:      [craft_targets, protected_craft, authorized_changes, unauthorized_changes, anti_slop_targets, anti_slop_risks, style_profile, failure_modes, invention_budget]
  scene_contract:        [expected_properties]
  fiction_boundary:      [expected_properties]

# ---- constraint_check causal-set grading (enforced by the validator) ----
# The gold response is JSON: {"violation": bool, "constraint_ids": [...], ...}.
# - gold constraint_ids MUST equal the front-matter causal_constraint_ids AS A SET
#   (order ignored; a missing or extra ID fails; the grader names the omitted ID).
# - every ID in either set must be declared in that record's ## Context (e.g. "- C1 (...)").
# - a non-violation (violation:false) must have constraint_ids == [] and causal_constraint_ids == [].
# - no duplicate IDs.
constraint_check_grading:
  gold_field: constraint_ids
  causal_field: causal_constraint_ids
  set_equality: true
  order_ignored: true

# ---- invention_budget rules (enforced by the validator) ----
# level: none | bounded | open
#   none    -> allowed MUST be empty (no new facts/images/actions/objects/backstory/motive)
#   bounded -> allowed MUST list >=1 specific permitted invention
#   open    -> broader invention permitted, but prohibited MUST still be stated
# allowed and prohibited are always lists.
invention_budget_levels: [none, bounded, open]

# ---- structured revision output (no-change protocol) ----
# A focused_revision gold MAY be the structured object
#   {"changed": false, "reason": "<brief>", "text": "<source unchanged>"}
# or {"changed": true,  "reason": "<brief>", "text": "<revised>"}.
# When changed==false the validator requires text to equal the ## Context source
# (whitespace-normalized). See specification.md "No-change protocol".

# ---- public-domain provenance (enforced by the validator) ----
# When source_type == public_domain, public_domain_source is REQUIRED and must
# carry: title, author, publication_year, edition_or_archive,
# source_url_or_identifier, verification_note.
public_domain_source_fields:
  - title
  - author
  - publication_year
  - edition_or_archive
  - source_url_or_identifier
  - verification_note

# ---- meaning of the `## Context` section, by task family ----
# Context is family-specific; do not overload it.
context_semantics:
  canon_extraction:  "the source passage or supplied evidence"
  constraint_check:  "the declared constraints/canon plus the passage being checked"
  focused_revision:  "the prose to revise"
  scene_contract:    "the writer's scene request and any available project constraints"
  fiction_boundary:  "only the framing needed to classify the task; the meta-rationale goes in ## Classification Rationale, NOT here"

# ---- required human-readable sections (## headings) by task family ----
# 'Rejected Response' + 'Rejection Reasons' are required for focused_revision and
# fiction_boundary; optional elsewhere (omit explicitly, do not pad with filler).
sections_required_all:
  - Instruction
  - Context
  - Gold Response
  - Evaluation
  - Reviewer Notes

sections_required_by_task_type:
  focused_revision:  [Protected Elements, Rejected Response, Rejection Reasons]
  fiction_boundary:  [Rejected Response, Rejection Reasons, Classification Rationale]
  scene_contract:    [Protected Elements]

# sections allowed to be absent without penalty (per task family)
sections_optional:
  - Protected Elements
  - Rejected Response
  - Rejection Reasons
