# succeeding is NOT proof of a working CUDA/training stack).

experiment_id: run001-lora-smoke        # provisional
status: provisional-draft               # not runnable until verified

model:
  base_model: prism-ml/Ternary-Bonsai-4B-unpacked
  base_model_revision: TODO             # pin exact commit/revision before running
  tokenizer_revision: TODO              # pin exact tokenizer revision

paths:
  output_dir: experiments/checkpoints/run001-lora-smoke   # provisional
  cache_dir: experiments/.hf_cache                        # provisional (git-ignored)

reproducibility:
  seed: 20260721                        # provisional

sequence:
  max_seq_length: 2048                  # provisional; calibrate to packet profiles

lora:
  rank: 16                              # provisional (smoke: small)
  alpha: 32                             # provisional
  dropout: 0.05                         # provisional
  target_modules:                       # provisional; confirm against model arch
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

optimization:
  learning_rate: 2.0e-4                 # provisional (note: ternary QAT wants 10-50x higher;
