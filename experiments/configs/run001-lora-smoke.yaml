  max_steps: 100                        # provisional (smoke: 50-200)
  micro_batch_size: 1                   # provisional
  gradient_accumulation_steps: 8        # provisional
  gradient_checkpointing: true          # provisional
  precision: bf16                       # provisional (GB10 supports bf16; confirm)
  optimizer: adamw_torch                # provisional
  lr_scheduler: cosine                  # provisional
  warmup_ratio: 0.03                    # provisional

intervals:
  checkpoint_interval_steps: 50         # provisional
  eval_interval_steps: 50               # provisional
  logging_interval_steps: 10            # provisional

resume:
  resume_from_checkpoint: false         # provisional; set to a path to resume

compatibility_evidence:
  # Verified 2026-07-21 inside linewright-ternary-train:run001 on gx10-9141.
  torch_version: 2.10.0a0+b558c986e8.nv25.11   # NGC build; CUDA-enabled, untouched by pip installs
  cuda_runtime: "13.0"                  # driver 580.159.03 reports CUDA 13.0
  transformers_version: 5.14.1
  peft_version: 0.19.1
  accelerate_version: 1.14.0
