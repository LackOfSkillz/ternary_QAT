# Real HF ternary-QAT ONE-STEP rehearsal (Dispatch 18A.1). GX10 backend: hf only.
# Uses a DISPOSABLE synthetic dataset (never the real 28-record Dataset A train
# file) for a single optimizer step. Not the 20-step run.
experiment_id: dataset-a-hf-qat-onestep
status: onestep-rehearsal
production_approved: false
experimental_use_only: true

model:
  base_model: prism-ml/Ternary-Bonsai-4B-unpacked
  base_model_path: /workspace/hf-cache/prism-ml/Ternary-Bonsai-4B-unpacked
  base_model_revision: 4485fae7a00129467b9329b738110d88b2942a1a
  tokenizer_revision: 4485fae7a00129467b9329b738110d88b2942a1a

paths:
  output_dir: training/runs/dataset-a-smoke-v1/rehearsal-hf-qat
  logging_dir: training/runs/dataset-a-smoke-v1/rehearsal-hf-qat/logs
  cache_dir: /workspace/hf-cache

dataset:
  train_file: training/fixtures/hf-onestep-train.jsonl
  evaluation_file: training/fixtures/hf-onestep-eval.jsonl
  system_prompt_file: datasets/dataset-a/prompts/linewright-training-system-v1.txt
  train_checksum: 77d955c03f141b35168222fc60fd1fb377520ae5e2949fbbd196d35e811a88ee
  evaluation_checksum: 8d6d5807f642076e027f72e9421dbc8e62ffa70e5b355a36179615404abb4fc9
  system_prompt_checksum: 038d9ab8aac2aee9504aa7c81f8870cbad66338436aad3c4063b97b1fd205c3c
  format: sft_messages

reproducibility:
  seed: 20260721
  deterministic: true

sequence:
  max_sequence_length: 2048

ternary_qat:
  method: straight_through_estimator
  swap_linear: true
  group_size: 128
  rounding: half_even
  scale_dtype: fp16
  keep_modules_full_precision: [embed_tokens, lm_head]

optimization:
  learning_rate: 4.0e-3
  max_steps: 1
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  precision: bf16
  optimizer: adamw_torch
  completion_only_loss: true
  packing: false

intervals:
  checkpoint_interval_steps: 1
  eval_before_training: false
