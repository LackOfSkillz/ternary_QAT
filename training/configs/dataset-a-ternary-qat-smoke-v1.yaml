# Dataset A — ternary-QAT smoke test
# STATUS: PROVISIONAL — DO NOT EXECUTE from this dispatch. Prepared for comparison
# against dataset-a-lora-smoke-v1.yaml. The comparison must stay interpretable, so
# ONLY the fields QAT genuinely requires differ from the LoRA config. Pipeline
# validation only; not production; not evidence of quality.

experiment_id: dataset-a-ternary-qat-smoke-v1
status: smoke-ready
freeze_id: dataset-a-experimental-v1
production_approved: false
experimental_use_only: true

model:
  base_model: prism-ml/Ternary-Bonsai-4B-unpacked           # SAME base as LoRA config
  base_model_path: /workspace/hf-cache/prism-ml/Ternary-Bonsai-4B-unpacked
  base_model_revision: 4485fae7a00129467b9329b738110d88b2942a1a
  tokenizer_revision: 4485fae7a00129467b9329b738110d88b2942a1a

paths:
  output_dir: training/runs/dataset-a-smoke-v1/ternary-qat
  logging_dir: training/runs/dataset-a-smoke-v1/ternary-qat/logs
  cache_dir: /workspace/hf-cache

dataset:                                # SAME compiled artifacts and system prompt
  train_file: datasets/dataset-a/compiled/experimental-v1/train.jsonl
  evaluation_file: datasets/dataset-a/compiled/experimental-v1/evaluation.jsonl
  system_prompt_file: datasets/dataset-a/prompts/linewright-training-system-v1.txt
  train_checksum: 97778f2a334649c8a67376b09c42d297ebdf031e2123e6dcce378310cfbf8f38
  evaluation_checksum: 0f3ae4263c5a175b38af5723f04e161de98e30a4a8ac5be10a2153a5fe47fc3b
  system_prompt_checksum: 038d9ab8aac2aee9504aa7c81f8870cbad66338436aad3c4063b97b1fd205c3c
  format: sft_messages

reproducibility:
  seed: 20260721                        # SAME seed as LoRA config
  deterministic: true

sequence:
  max_sequence_length: 2048             # SAME as LoRA config

optimization:                           # SAME effective batch size and schedule shape as LoRA
  num_train_epochs: 1
  max_steps: 20                         # SAME as LoRA config (interpretable comparison)
  micro_batch_size: 1
  gradient_accumulation_steps: 8        # effective batch size 8, identical to LoRA
  gradient_checkpointing: true
  precision: bf16
  optimizer: adamw_torch
  lr_scheduler: cosine
  warmup_ratio: 0.03
  completion_only_loss: true
  packing: false
  # CHANGED for ternary QAT: quantization-aware training tolerates / wants a higher
  # LR than conventional LoRA (TRAINING_PILOT.md notes 10-50x). Provisional; calibrate.
  learning_rate: 4.0e-3                 # ~20x the LoRA LR; provisional

ternary_qat:                            # the only genuinely QAT-specific block
  method: straight_through_estimator    # ternary/ste.py
  swap_linear: true                     # ternary/swap.py replaces nn.Linear with ternary linear
  ternary_linear_module: ternary.linear # ternary/linear.py
  group_size: 128                       # Prism g128 convention (matches ternary_QAT.ternarize_weight)
  rounding: half_even                   # torch.round half-even; artifact-equivalent to Prism q2_0_ref
  scale_dtype: fp16                      # amax fp16 scale (Prism Q2_0)
  tie_word_embeddings_swap: true        # swap tied embedding/lm_head consistently
  keep_modules_full_precision:          # do not ternarize these (stability)
    - embed_tokens
    - lm_head
  preserve_base_checkpoint: true        # QAT must NOT modify the base checkpoint on disk

intervals:
  checkpoint_interval_steps: 10
  eval_interval_steps: 10
  logging_interval_steps: 2
  eval_before_training: true

stop_conditions:
  - train_eval_leakage_detected
  - loss_nan_or_inf
  - gradient_explosion
  - checkpoint_reload_failure
  - invalid_assistant_output_format
  - corrupted_structured_no_change_output
  - qat_modified_base_checkpoint_or_unrelated_files

notes: >
  Interpretable comparison contract: base model, train/evaluation files, seed,
  sequence length, effective batch size, and evaluation prompts are identical to
  dataset-a-lora-smoke-v1.yaml. Only the learning rate and the ternary_qat block
  differ. Uses the in-repo ternary/ package (linear.py, ste.py, swap.py) whose
  fwd/bwd + tied-weight swap were smoke-verified on the GX10 run001 image.
