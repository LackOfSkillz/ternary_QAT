comparison_integrity:
  do_not_silently_substitute: [Qwen3-Base, Qwen3.5, AWQ/GGUF community build for first comparison,
                               Ministral Base, Ministral Reasoning, unofficial Ministral quant]
  first_quality_comparison_precision:
    qwen3_8b: bf16 (official)
    ministral_3_8b: FP8 (official — this repo ships FP8; not a community quant)
    control_4b: bf16 (unpacked)
  engine_note: >-
    All roles decode greedily (deterministic argmax). Control 4B reuses HF-greedy
    Dispatch-24 results for the Fast Battery; candidates run on their practical
    runtime (HF for Qwen3; HF-Mistral3 or vLLM for Ministral FP8). Any engine
    difference is documented; greedy argmax is semantically equivalent across engines.

