prompt_execution_decision:
  dispatch: 28B
  provisional: true
  final_commercial_ship_certification: false
  generation_integrity: valid
  instrument_valid: true
  primary_branch: model_capability_is_primary_bottleneck
  primary_rationale: 'On the headline multi-constraint focused-revision failure every
    structured arm plateaus (all-required completed: P0-Maximal 0.250, P1-Contract
    0.250, P3-Ideal 0.000) although the model COMPREHENDS the contracts (6/6 comprehension
    pass, 4/6 execution fail). No prompt representation — exhaustive NL, structured
    contract, or hand-built ideal packet — cracks the ceiling; contract structure
    is a mechanical and soft wash (P1 - P0-Maximal clean -0.066), and the richer packet
    regresses. The residual is execution discipline bound by model capability, not
    a comprehension/representation gap a better prompt could close.'
  secondary_findings:
  - finding: requirement ELICITATION (not contract structure) is the real cross-family
      lever
    evidence: 'P0-Realistic -> P0-Maximal: clean 0.400 -> 0.633; focused-revision
      mean changes 1.00 -> 2.25; canon clean 0.0 -> 1.0; no-change accuracy 0.75 ->
      1.0. Achievable in plain prose; it does not require the LineWright contract
      format.'
    branch: prioritize_requirement_elicitation
  - finding: contract STRUCTURE adds no reliability and mildly hurts scope
    evidence: P1 - P0-Maximal clean -0.066; P1 introduces 1 new protected corruption
      + 2 forbidden violations and drops canon clean 1.0 -> 0.667; soft prose/voice/rigidity
      deltas vs P0-Maximal are ~0 (within noise).
  - finding: the richer ideal packet is a NET NEGATIVE
    evidence: P3-Ideal - P1 clean 0.000 and it under-executes focused revision (mean
      changes 1.25 vs 2.08); blind review scores it softly WORSE on the same 10 tasks
      (rigidity -0.298, prose -0.160, over_editing -0.195) -> a soft anti-result.
  - finding: comprehension is saturated while execution fails -> a trainable execution-discipline
      gap
    evidence: comprehension probes 6/6 pass, execution 4/6 pass_fail. If a stronger
      model still shows the gap, the lever is training a reliable packet EXECUTOR,
      not prompt engineering.
    branch: shift_training_to_packet_executor
  product_thesis: partially_supported
  product_thesis_note: The product thesis as stated — that LineWright CONTRACT STRUCTURE
    makes the model more reliable — is NOT supported (all three floors fail; P1 does
    not beat equal-information NL mechanically or softly; the ideal packet regresses).
    The weaker claim that CLEAR REQUIREMENT SPECIFICATION helps IS supported, but
    that is requirement elicitation, achievable in plain prose, and the headline focused-revision
    failure is capability-bound.
